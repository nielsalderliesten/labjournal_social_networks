name: "Example Lab Journal"
author: 
  - 'Your Name'
output_dir: "docs"
exclude: 
  - "data"
  - "_test"
bibliography: references.bib
navbar:
  left:
    - icon: fa-home
      href: index.html
    - text: "Lab Journal"
      menu:
      - text: "Week 1"  
        href: Week1.html
        # here, other .Rmds can be added
      - text: "Week 2"
        href: Week2.html
      - text: "Week 3"
        href: Week3.html
      - text: 'Week 4'
        href: Week4.html
    - text: "Manuscript"
      menu:
      - text: "Introduction"
        href: introduction_manuscript.html
      - text: "Data"
        href: datapreperation.html
  right:
  - icon: fab fa-github
    href: https://nielsalderliesten.github.io/labjournal_social_networks/
output:
  html_document:
    theme: cerulean
    highlight: default
    toc:  true
    toc_float: true
    number_sections: true
    code_folding: show
    code_download: yes
    css: tweaks.css
